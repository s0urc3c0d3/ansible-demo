---
- name: Store EniCloud display name for OpenShift Virtualization volume
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    validate_certs: false
    effective_host: "{{ host | default(lookup('env', 'K8S_AUTH_HOST'), true) | default(lookup('env', 'OPENSHIFT_HOST'), true) | default(lookup('env', 'OPENSHIFT_API_HOST'), true) }}"
    effective_api_key: "{{ api_key | default(lookup('env', 'K8S_AUTH_API_KEY'), true) | default(lookup('env', 'OPENSHIFT_API_KEY'), true) }}"
    effective_volume_id: "{{ volume_id | default(resource_id, true) }}"
    effective_volume_name: "{{ volume_name | default(name, true) }}"
    effective_volume_project: "{{ volume_project | default(vm_project, true) | default(project, true) | default(namespace, true) }}"

  tasks:
    - name: Validate volume rename inputs
      ansible.builtin.assert:
        that:
          - effective_host is defined
          - effective_host | length > 0
          - effective_api_key is defined
          - effective_api_key | length > 0
          - effective_volume_id is defined
          - effective_volume_id | length > 0
          - effective_volume_name is defined
          - effective_volume_name | length > 0
          - effective_volume_project is defined
          - effective_volume_project | length > 0
        fail_msg: "Required vars: host/api_key or AAP Kubernetes credential env, volume_id, volume_name/name and volume_project."

    - name: Read DataVolume
      kubernetes.core.k8s_info:
        host: "{{ effective_host }}"
        api_key: "{{ effective_api_key }}"
        validate_certs: "{{ validate_certs }}"
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ effective_volume_id }}"
        namespace: "{{ effective_volume_project }}"
      register: datavolume_info
      failed_when: false
      changed_when: false

    - name: Read PVC
      kubernetes.core.k8s_info:
        host: "{{ effective_host }}"
        api_key: "{{ effective_api_key }}"
        validate_certs: "{{ validate_certs }}"
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ effective_volume_id }}"
        namespace: "{{ effective_volume_project }}"
      register: pvc_info
      failed_when: false
      changed_when: false

    - name: Validate volume resource exists
      ansible.builtin.assert:
        that:
          - (datavolume_info.resources | default([]) | length) > 0 or (pvc_info.resources | default([]) | length) > 0
        fail_msg: "Neither DataVolume nor PVC exists for volume_id in volume_project."

    - name: Store display name on DataVolume
      kubernetes.core.k8s:
        host: "{{ effective_host }}"
        api_key: "{{ effective_api_key }}"
        validate_certs: "{{ validate_certs }}"
        state: patched
        definition:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: "{{ effective_volume_id }}"
            namespace: "{{ effective_volume_project }}"
            annotations:
              enicloud.io/display-name: "{{ effective_volume_name }}"
      when: (datavolume_info.resources | default([]) | length) > 0

    - name: Store display name on PVC
      kubernetes.core.k8s:
        host: "{{ effective_host }}"
        api_key: "{{ effective_api_key }}"
        validate_certs: "{{ validate_certs }}"
        state: patched
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ effective_volume_id }}"
            namespace: "{{ effective_volume_project }}"
            annotations:
              enicloud.io/display-name: "{{ effective_volume_name }}"
      when: (pvc_info.resources | default([]) | length) > 0

    - name: Expose EniCloud volume rename result
      ansible.builtin.set_stats:
        data:
          volume_id: "{{ effective_volume_id }}"
          volume_name: "{{ effective_volume_name }}"
          volume_project: "{{ effective_volume_project }}"
          eni_result:
            volume_id: "{{ effective_volume_id }}"
            volume_name: "{{ effective_volume_name }}"
            volume_project: "{{ effective_volume_project }}"
            status: renamed
            rename_mode: display_name_annotation
