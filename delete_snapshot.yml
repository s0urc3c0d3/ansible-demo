- name: Delete OpenShift Virtualization VM snapshot
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # VM details
    #snapshot_name: my-test-vm
    #vm_project: default
    validate_certs: false

  tasks:
  - name: Delete vmsnapshot
    kubernetes.core.k8s:
      state: absent
      definition:
        kind: VirtualMachineSnapshot
        apiVersion: "snapshot.kubevirt.io/v1beta1"
        metadata:
          name: "{{ snapshot_name }}"
          namespace: "{{ vm_project }}"

  - name: Expose EniCloud snapshot delete result
    ansible.builtin.set_stats:
      data:
        resource_id: "{{ snapshot_name }}"
        snapshot_id: "{{ snapshot_name }}"
        snapshot_name: "{{ snapshot_name }}"
        vm_project: "{{ vm_project }}"
        namespace: "{{ vm_project }}"
        status: deleted
        eni_result:
          resource_id: "{{ snapshot_name }}"
          snapshot_id: "{{ snapshot_name }}"
          snapshot_name: "{{ snapshot_name }}"
          vm_project: "{{ vm_project }}"
          namespace: "{{ vm_project }}"
          status: deleted
