- name: Create a VM on OpenShift Virtualization
  hosts: localhost
  #hosts: openshift
  connection: local
  gather_facts: false

  vars:
    # VM details
    #vm_name: my-test-vm
    #vm_project: default
    validate_certs: false

  tasks:
    - name: Create virtual machine
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ vm_name }}"
        namespace: "{{ vm_project }}"
        api_key: "{{ api_key }}"
        validate_certs: "{{ validate_certs }}"
        state: absent
